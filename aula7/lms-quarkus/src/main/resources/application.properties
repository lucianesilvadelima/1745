# Swagger UI disponível também no jar final (não só em modo dev): http://localhost:8080/q/swagger-ui
quarkus.swagger-ui.always-include=true
quarkus.smallrye-openapi.info-title=LMS - Learning Management System

# ---------- Banco de dados (PostgreSQL rodando no Docker: veja docker-compose.yml) ----------
quarkus.datasource.db-kind=postgresql
# %dev = ./mvnw quarkus:dev | %prod = java -jar target/quarkus-app/quarkus-run.jar
%dev,prod.quarkus.datasource.username=lms
%dev,prod.quarkus.datasource.password=lms
%dev,prod.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/lms
# Desliga o "Dev Services" no modo dev: queremos usar o banco do docker compose.
%dev.quarkus.datasource.devservices.enabled=false

# Nos testes (%test) não há URL configurada: o Quarkus sobe sozinho um PostgreSQL descartável
# (Dev Services, também via Docker), para os testes não apagarem os dados do banco do docker compose.

# Hibernate cria as tabelas a partir das classes @Entity.
# drop-and-create: apaga e recria tudo a cada start (bom para aula; em produção use migrations, ex.: Flyway).
quarkus.hibernate-orm.schema-management.strategy=drop-and-create
# depois de criar as tabelas, executa este script com os dados iniciais
quarkus.hibernate-orm.sql-load-script=import.sql
# mostra no console os SQL gerados pelo Hibernate
quarkus.hibernate-orm.log.sql=true
